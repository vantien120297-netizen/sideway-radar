<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SIDEWAY RADAR">
<link rel="manifest" href="manifest.json">
<title>SIDEWAY RADAR</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#eef2f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{padding:calc(16px + env(safe-area-inset-top)) 14px 10px;position:sticky;top:0;background:#0b0f14ee;backdrop-filter:blur(14px);z-index:5}
h1{font-size:24px;margin:0 0 3px}.sub{font-size:12px;color:#8e9aa7}
.tabs{display:flex;gap:7px;margin-top:13px}.tab,.scan{border:0;border-radius:10px;padding:10px 14px;font-weight:800}
.tab{background:#202832;color:#fff}.tab.active{background:#fff;color:#111}.scan{float:right;margin-top:-39px;background:#1687ff;color:#fff}
#status{padding:8px 14px;font-size:12px;color:#9aa6b2}.notice{padding:0 14px 10px;color:#ffd166;font-size:12px}
.section{padding:0 12px}.section h2{font-size:15px;margin:12px 2px 8px}
.card{background:#121820;border:1px solid #202a35;border-radius:14px;padding:11px;margin:7px 0}
.top{display:flex;justify-content:space-between;align-items:center}.sym{font-size:16px;font-weight:900}.radar{font-size:23px;font-weight:900}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.box{background:#0b1117;border-radius:9px;padding:7px;text-align:center}.lab{font-size:9px;color:#7e8a97}.val{font-size:17px;font-weight:900}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px;font-size:11px;color:#aeb8c3}.meta b{color:#fff}
.hot{color:#ff6b6b}.warn{color:#ffd166}.good{color:#63e6a8}.muted{color:#8793a0}
.empty{padding:16px;border:1px dashed #33404d;border-radius:12px;color:#8e9aa7;font-size:13px}
.detail{display:none;position:fixed;inset:0;background:#0b0f14;z-index:20;overflow:auto;padding:calc(18px + env(safe-area-inset-top)) 14px 30px}
.back{border:0;border-radius:10px;padding:10px 14px;background:#202832;color:#fff;font-weight:800;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:#121820;border-radius:12px;padding:12px}.metric span{display:block;color:#7e8a97;font-size:10px}.metric b{font-size:19px}
footer{height:30px}
</style>
</head>
<body>
<header>
<h1>SIDEWAY RADAR</h1>
<div class="sub">iPhone độc lập • Binance Top 100 • Không biểu đồ nến</div>
<div class="tabs">
<button class="tab" data-i="1h">1H</button>
<button class="tab active" data-i="4h">4H</button>
<button class="tab" data-i="1d">1D</button>
</div>
<button class="scan" id="scan">QUÉT</button>
</header>
<div id="status">Sẵn sàng</div>
<div class="notice">🔥 Cơ hội = SIDEWAY ≥75 • PRE ≥75 • BREAKOUT &lt;80</div>
<section class="section"><h2>🔥 CƠ HỘI SIDEWAY</h2><div id="opps"></div></section>
<section class="section"><h2>📊 TOP RADAR</h2><div id="top"></div></section>
<section class="section"><h2>🚨 ĐÃ BREAKOUT</h2><div id="breaks"></div></section>
<div id="detail" class="detail"><button class="back" onclick="closeDetail()">← QUAY LẠI</button><div id="detailBody"></div></div>
<footer></footer>
<script src="app.js"></script>
</body>
</html>
